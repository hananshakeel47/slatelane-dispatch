name: FMCSA SMS dry-run tests

on:
  pull_request:
    paths:
      - "SCRIPTS/fmcsa-sms-discovery-core.mjs"
      - "SCRIPTS/test-fmcsa-sms-discovery.mjs"
      - ".github/workflows/fmcsa-sms-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run FMCSA SMS discovery tests
        run: node SCRIPTS/test-fmcsa-sms-discovery.mjs
